name: linkco-mr

# One container, production topology inside:
#   nginx :8000 (published) -> uvicorn 127.0.0.1:8001 (loopback, not exposed)
# State lives on the host via the mounts below — the image is stateless.
services:
  woms:
    build: .
    image: linkco-mr:latest
    container_name: linkco-mr
    ports:
      - "${WOMS_PORT:-8000}:8000"
    volumes:
      - ./file.xlsx:/app/file.xlsx
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      WOMS_JWT_SECRET: ${WOMS_JWT_SECRET:-}
      # Only needed if you serve the UI from a different origin than the API;
      # same-origin behind nginx needs nothing.
      WOMS_CORS_ORIGINS: ${WOMS_CORS_ORIGINS:-}
    restart: unless-stopped
