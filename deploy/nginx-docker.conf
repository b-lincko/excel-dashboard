# Linkco MR — nginx reverse proxy, DOCKER variant of deploy/nginx.conf.
# Container paths: frontend at /app/frontend/dist, backend on loopback :8001,
# logs under /app/data/logs (a host mount — inspect them from the host).
# Runs as: nginx -c /app/deploy/nginx-docker.conf -g 'daemon off;'

user www-data;
worker_processes auto;
pid /app/data/logs/nginx.pid;
error_log /app/data/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /app/deploy/mime.types;   # ships in the image, self-contained
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rid=$request_id rt=$request_time';
    access_log /app/data/logs/nginx-access.log main;

    # Excel workbook + attachment uploads
    client_max_body_size 25m;
    client_body_timeout 60s;

    # Gentle brute-force dampening for login attempts (per client IP).
    limit_req_zone $binary_remote_addr zone=woms_auth:10m rate=20r/m;
    limit_req_status 429;

    upstream woms_backend {
        server 127.0.0.1:8001;
        keepalive 16;
    }

    server {
        listen 0.0.0.0:8000;
        server_name _;

        root /app/frontend/dist;
        index index.html;

        # Security headers for static files. API responses carry their own set
        # from the app middleware (X-Frame-Options: SAMEORIGIN stays). A
        # location with its own add_header does NOT inherit these, so blocks
        # below re-declare what they need.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # Hashed Vite bundles — immutable, served pre-compressed (gzip_static)
        location /assets/ {
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /api/auth/login {
            limit_req zone=woms_auth burst=10 nodelay;
            proxy_pass http://woms_backend;
            include /app/deploy/proxy_params.conf;
        }

        # API -> FastAPI. No URI on proxy_pass: the path is forwarded as-is.
        location /api/ {
            proxy_pass http://woms_backend;
            include /app/deploy/proxy_params.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;    # big report downloads (PDF/XLSX/CSV)
            proxy_send_timeout 120s;
            proxy_buffering on;
        }

        # Single-page app fallback (/approvals, /work-orders/..., ...)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Friendly payload when the backend is down/restarting (static JSON,
        # served by internal redirect — keeps the original 502/503/504 status)
        error_page 502 503 504 /maintenance.json;
        location = /maintenance.json {
            internal;
            root /app/deploy;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
    }
}
