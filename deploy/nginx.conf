# Linkco MR — nginx reverse proxy (production entry point)
#
# Topology:  browser -> nginx :8000 -> uvicorn 127.0.0.1:8001
#   - nginx serves the built frontend (frontend/dist) with long-lived caching
#     for hashed /assets and no-cache for index.html
#   - /api/* is proxied to the backend, which binds to loopback only and is
#     never exposed directly
#
# This file uses repo-relative absolute paths for THIS deployment
# (/home/user/excel-dashboard). On another host, adjust: root, the three
# log/pid paths and the include below — see deploy/README.md.
#
# Start:  deploy/nginx/sbin/nginx -c deploy/nginx.conf   (daemon mode)
#   or    nginx -c "$ROOT/deploy/nginx.conf" -g 'daemon off;'   (foreground)
# Stop:   kill "$(cat data/logs/nginx.pid)"
# Test:   deploy/nginx/sbin/nginx -c deploy/nginx.conf -t

user www-data;
worker_processes auto;
pid /home/user/excel-dashboard/data/logs/nginx.pid;
error_log /home/user/excel-dashboard/data/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;          # ships next to this file — self-contained
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rid=$request_id rt=$request_time';
    access_log /home/user/excel-dashboard/data/logs/nginx-access.log main;

    # Excel workbook + attachment uploads
    client_max_body_size 25m;
    client_body_timeout 60s;

    # Gentle brute-force dampening for login attempts (per client IP).
    limit_req_zone $binary_remote_addr zone=woms_auth:10m rate=20r/m;
    limit_req_status 429;

    upstream woms_backend {
        server 127.0.0.1:8001;
        keepalive 16;
    }

    server {
        listen 0.0.0.0:8000;
        server_name _;

        root /home/user/excel-dashboard/frontend/dist;
        index index.html;

        # Security headers for static files. API responses carry their own set
        # from the app middleware (X-Frame-Options: SAMEORIGIN stays). A
        # location with its own add_header does NOT inherit these, so blocks
        # below re-declare what they need.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        # Hashed Vite bundles — immutable, served pre-compressed (gzip_static)
        location /assets/ {
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /api/auth/login {
            limit_req zone=woms_auth burst=10 nodelay;
            proxy_pass http://woms_backend;
            include /home/user/excel-dashboard/deploy/proxy_params.conf;
        }

        # API -> FastAPI. No URI on proxy_pass: the path is forwarded as-is.
        location /api/ {
            proxy_pass http://woms_backend;
            include /home/user/excel-dashboard/deploy/proxy_params.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;    # big report downloads (PDF/XLSX/CSV)
            proxy_send_timeout 120s;
            proxy_buffering on;
        }

        # Single-page app fallback (/approvals, /work-orders/..., ...)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Friendly payload when the backend is down/restarting (static JSON,
        # served by internal redirect — keeps the original 502/503/504 status)
        error_page 502 503 504 /maintenance.json;
        location = /maintenance.json {
            internal;
            root /home/user/excel-dashboard/deploy;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }
    }
}
