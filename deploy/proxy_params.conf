# Proxy headers for the FastAPI backend (included by nginx.conf).
# uvicorn's --proxy-headers + forwarded_allow_ips=127.0.0.1 picks these up so
# the app logs and audit trail see the real client instead of 127.0.0.1.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
