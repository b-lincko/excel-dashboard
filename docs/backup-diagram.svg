<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect width="1180" height="920" fill="#F8FAFC"/>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#0F3D5E">LinkCO MR — backup process &amp; storage</text>
  <text x="30" y="66" font-size="13" fill="#64748B">How every snapshot is taken, where it lands on disk, and how it comes back. All numbers are app defaults (data/app_config.json).</text>

  <!-- ============ LIVE DATA ============ -->
  <rect x="30" y="110" width="240" height="300" rx="14" fill="#0F3D5E"/>
  <text x="150" y="140" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">LIVE DATA (host)</text>
  <text x="150" y="158" font-size="11" fill="#B8D4E8" text-anchor="middle">git-ignored · bind-mounted in Docker</text>

  <rect x="50" y="176" width="200" height="54" rx="9" fill="#fff"/>
  <text x="62" y="197" font-size="13" font-weight="700" fill="#0F172A">data/woms.db</text>
  <text x="62" y="214" font-size="11" fill="#64748B">SQLite — source of truth</text>

  <rect x="50" y="240" width="200" height="54" rx="9" fill="#fff"/>
  <text x="62" y="261" font-size="13" font-weight="700" fill="#0F172A">file.xlsx</text>
  <text x="62" y="278" font-size="11" fill="#64748B">Excel replica (rewritten 00:00)</text>

  <rect x="50" y="304" width="200" height="54" rx="9" fill="#fff"/>
  <text x="62" y="325" font-size="12" font-weight="600" fill="#0F172A">data/app_config.json</text>
  <text x="62" y="342" font-size="11" fill="#64748B">settings · .jwt_secret · attachments/</text>

  <text x="150" y="392" font-size="11" fill="#B8D4E8" text-anchor="middle">kept even if admin reset runs</text>

  <!-- ============ TRIGGERS ============ -->
  <rect x="320" y="110" width="250" height="436" rx="14" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="445" y="138" font-size="15" font-weight="700" fill="#0C4A6E" text-anchor="middle">1 · TRIGGERS</text>

  <rect x="338" y="154" width="214" height="66" rx="9" fill="#fff" stroke="#BAE6FD"/>
  <text x="350" y="174" font-size="12" font-weight="700" fill="#0F172A">⏰ Scheduled autobackup</text>
  <text x="350" y="190" font-size="11" fill="#475569">daemon checks every 20 s</text>
  <text x="350" y="206" font-size="11" fill="#475569">default: 00:00, every day, ON</text>

  <rect x="338" y="230" width="214" height="52" rx="9" fill="#fff" stroke="#BAE6FD"/>
  <text x="350" y="250" font-size="12" font-weight="700" fill="#0F172A">🖱 Manual — Backup now</text>
  <text x="350" y="266" font-size="11" fill="#475569">Settings ▸ Backup (perm: backup)</text>

  <rect x="338" y="292" width="214" height="80" rx="9" fill="#fff" stroke="#BAE6FD"/>
  <text x="350" y="312" font-size="12" font-weight="700" fill="#0F172A">💾 Every data change</text>
  <text x="350" y="328" font-size="11" fill="#475569">create · update · bulk · delete</text>
  <text x="350" y="344" font-size="11" fill="#475569">import · upload · reconcile</text>
  <text x="350" y="360" font-size="11" fill="#475569">= write-safety snapshot</text>

  <rect x="338" y="382" width="214" height="52" rx="9" fill="#fff" stroke="#BAE6FD"/>
  <text x="350" y="402" font-size="12" font-weight="700" fill="#0F172A">↩ Before every restore</text>
  <text x="350" y="418" font-size="11" fill="#475569">automatic pre_restore pair</text>

  <rect x="338" y="444" width="214" height="88" rx="9" fill="#FEF9C3" stroke="#FDE047"/>
  <text x="350" y="464" font-size="12" font-weight="700" fill="#713F12">First: DB → file.xlsx</text>
  <text x="350" y="480" font-size="11" fill="#713F12">auto + manual runs export all</text>
  <text x="350" y="496" font-size="11" fill="#713F12">SQLite rows into the workbook</text>
  <text x="350" y="512" font-size="11" fill="#713F12">before the snapshot is taken</text>

  <!-- ============ create_backup ============ -->
  <rect x="620" y="110" width="270" height="436" rx="14" fill="#0EA5E9"/>
  <text x="755" y="138" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2 · create_backup(reason)</text>
  <text x="755" y="156" font-size="11" fill="#E0F2FE" text-anchor="middle">excel/service.py — never raises</text>

  <rect x="638" y="172" width="234" height="76" rx="9" fill="#fff"/>
  <text x="650" y="192" font-size="12" font-weight="700" fill="#0F172A">① Copy file.xlsx</text>
  <text x="650" y="208" font-size="11" fill="#475569">write .part → fsync → atomic rename</text>
  <text x="650" y="224" font-size="11" fill="#475569">re-opened to prove it's readable</text>

  <rect x="638" y="258" width="234" height="76" rx="9" fill="#fff"/>
  <text x="650" y="278" font-size="12" font-weight="700" fill="#0F172A">② Snapshot woms.db</text>
  <text x="650" y="294" font-size="11" fill="#475569">SQLite backup API, 3 attempts</text>
  <text x="650" y="310" font-size="11" fill="#475569">fallback: durable file copy</text>

  <rect x="638" y="344" width="234" height="62" rx="9" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="650" y="364" font-size="12" font-weight="700" fill="#064E3B">③ Excel copy fails?</text>
  <text x="650" y="380" font-size="11" fill="#065F46">the .db snapshot still lands</text>
  <text x="650" y="396" font-size="11" fill="#065F46">(backup must never fail)</text>

  <rect x="638" y="416" width="234" height="62" rx="9" fill="#fff"/>
  <text x="650" y="436" font-size="12" font-weight="700" fill="#0F172A">④ Health check</text>
  <text x="650" y="452" font-size="11" fill="#475569">row counts: backup vs live</text>
  <text x="650" y="468" font-size="11" fill="#475569">result → audit log + Settings</text>

  <rect x="638" y="488" width="234" height="44" rx="9" fill="#0F3D5E"/>
  <text x="755" y="507" font-size="11" fill="#B8D4E8" text-anchor="middle">pair is written together,</text>
  <text x="755" y="523" font-size="11" fill="#B8D4E8" text-anchor="middle">same stem + timestamp</text>

  <!-- arrows triggers -> create_backup -->
  <line x1="570" y1="240" x2="613" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="328" x2="613" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="408" x2="613" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="188" x2="613" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <!-- live data -> triggers (export context) -->
  <line x1="270" y1="267" x2="333" y2="480" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ============ STORAGE ============ -->
  <rect x="940" y="110" width="210" height="436" rx="14" fill="#134E4A"/>
  <text x="1045" y="138" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3 · ON DISK</text>
  <text x="1045" y="156" font-size="11" fill="#99F6E4" text-anchor="middle">backups/ (git-ignored)</text>

  <rect x="956" y="172" width="178" height="196" rx="9" fill="#0B1220"/>
  <text x="968" y="192" font-size="11" fill="#5EEAD4" font-family="Consolas, monospace">backups/</text>
  <text x="980" y="210" font-size="10.5" fill="#CBD5E1" font-family="Consolas, monospace">├─ 2026-09-12/</text>
  <text x="992" y="226" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">│  file_…_00:00_auto.xlsx</text>
  <text x="992" y="242" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">│  file_…_00:00_auto.db</text>
  <text x="980" y="262" font-size="10.5" fill="#CBD5E1" font-family="Consolas, monospace">├─ archive/2026-08/</text>
  <text x="992" y="278" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">│  (old pairs, by month)</text>
  <text x="980" y="298" font-size="10.5" fill="#CBD5E1" font-family="Consolas, monospace">└─ 2026-09-13/ …</text>
  <text x="968" y="322" font-size="10.5" fill="#5EEAD4" font-family="Consolas, monospace">stem_TS_reason.xlsx+.db</text>
  <text x="968" y="340" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">reason: auto manual</text>
  <text x="968" y="356" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">create update bulk delete</text>
  <text x="968" y="364" font-size="10.5" fill="#94A3B8" font-family="Consolas, monospace">import upload reconcile</text>

  <rect x="956" y="380" width="178" height="70" rx="9" fill="#fff"/>
  <text x="968" y="400" font-size="11.5" font-weight="700" fill="#0F172A">Paired by name</text>
  <text x="968" y="416" font-size="10.5" fill="#475569">a .db without its .xlsx, or</text>
  <text x="968" y="431" font-size="10.5" fill="#475569">leftover Excel alone, is not a</text>
  <text x="968" y="446" font-size="10.5" fill="#475569">complete restore point</text>

  <rect x="956" y="460" width="178" height="72" rx="9" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="968" y="480" font-size="11.5" font-weight="700" fill="#713F12">Off-box copy</text>
  <text x="968" y="496" font-size="10.5" fill="#713F12">Download = .zip with the</text>
  <text x="968" y="511" font-size="10.5" fill="#713F12">pair — store it outside the</text>
  <text x="968" y="526" font-size="10.5" fill="#713F12">server (cloud / USB)</text>

  <line x1="890" y1="240" x2="933" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="890" y1="330" x2="933" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="890" y1="496" x2="933" y2="496" stroke="#B45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrAmber)"/>

  <!-- ============ RETENTION ============ -->
  <rect x="320" y="580" width="570" height="120" rx="14" fill="#fff" stroke="#CBD5E1"/>
  <text x="605" y="608" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">4 · HOUSEKEEPING (runs after auto &amp; manual backups)</text>
  <rect x="340" y="622" width="160" height="62" rx="9" fill="#F1F5F9"/>
  <text x="420" y="644" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">keep 14</text>
  <text x="420" y="660" font-size="10.5" fill="#475569" text-anchor="middle">auto + manual pairs</text>
  <text x="420" y="675" font-size="10.5" fill="#475569" text-anchor="middle">(backup_ratio)</text>
  <rect x="516" y="622" width="160" height="62" rx="9" fill="#F1F5F9"/>
  <text x="596" y="644" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">keep 8</text>
  <text x="596" y="660" font-size="10.5" fill="#475569" text-anchor="middle">write-safety snapshots</text>
  <text x="596" y="675" font-size="10.5" fill="#475569" text-anchor="middle">(backup_write_keep)</text>
  <rect x="692" y="622" width="90" height="62" rx="9" fill="#FFEDD5"/>
  <text x="737" y="644" font-size="12" font-weight="700" fill="#7C2D12" text-anchor="middle">&gt; 30 days</text>
  <text x="737" y="662" font-size="10.5" fill="#7C2D12" text-anchor="middle">→ archive/</text>
  <rect x="798" y="622" width="76" height="62" rx="9" fill="#FEE2E2"/>
  <text x="836" y="644" font-size="12" font-weight="700" fill="#7F1D1D" text-anchor="middle">&gt; 180</text>
  <text x="836" y="662" font-size="10.5" fill="#7F1D1D" text-anchor="middle">deleted</text>
  <line x1="737" y1="580" x2="737" y2="550" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="737" y1="550" x2="980" y2="550" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="980" y1="550" x2="980" y2="546" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- ============ RESTORE FLOW ============ -->
  <rect x="30" y="580" width="260" height="310" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="160" y="608" font-size="15" font-weight="700" fill="#7F1D1D" text-anchor="middle">5 · RESTORE</text>

  <rect x="46" y="622" width="228" height="58" rx="9" fill="#fff"/>
  <text x="58" y="642" font-size="11.5" font-weight="700" fill="#0F172A">Upload &amp; restore (.xlsx/.db/.zip)</text>
  <text x="58" y="658" font-size="10.5" fill="#475569">validated first: header scan, no .xls,</text>
  <text x="58" y="673" font-size="10.5" fill="#475569">refuse empty / &lt; 50% rows, no zip-slip</text>

  <rect x="46" y="690" width="228" height="58" rx="9" fill="#fff"/>
  <text x="58" y="710" font-size="11.5" font-weight="700" fill="#0F172A">Restore from list (Settings)</text>
  <text x="58" y="726" font-size="10.5" fill="#475569">Check counts → Restore — always</text>
  <text x="58" y="741" font-size="10.5" fill="#475569">takes a pre_restore snapshot first</text>

  <rect x="46" y="758" width="228" height="58" rx="9" fill="#fff"/>
  <text x="58" y="778" font-size="11.5" font-weight="700" fill="#0F172A">CLI — docs/RECOVERY.md</text>
  <text x="58" y="794" font-size="10.5" fill="#475569">works even when the app is down:</text>
  <text x="58" y="809" font-size="10.5" fill="#475569">copy the pair back onto data/ + file.xlsx</text>

  <rect x="46" y="826" width="228" height="46" rx="9" fill="#FEE2E2"/>
  <text x="58" y="845" font-size="11" font-weight="700" fill="#7F1D1D">Excel-only restore does NOT</text>
  <text x="58" y="861" font-size="11" font-weight="700" fill="#7F1D1D">re-seed the database</text>

  <!-- restore arrow back to live data -->
  <path d="M 160 580 L 160 470 L 150 412" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="172" y="505" font-size="11" fill="#B91C1C">replaces live .db / .xlsx</text>

  <!-- ============ LEGEND ============ -->
  <rect x="940" y="580" width="210" height="310" rx="14" fill="#fff" stroke="#CBD5E1"/>
  <text x="1045" y="608" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">RULES TO REMEMBER</text>
  <g font-size="11" fill="#334155">
    <text x="956" y="636">• SQLite is the source of truth;</text>
    <text x="966" y="652">Excel is a replica for humans.</text>
    <text x="956" y="680">• .xlsx + .db are always written</text>
    <text x="966" y="696">as a pair with the same name.</text>
    <text x="956" y="724">• A backup is verified (row count)</text>
    <text x="966" y="740">after every auto/manual run.</text>
    <text x="956" y="768">• Docker bind-mounts data/ and</text>
    <text x="966" y="784">backups/ — restart keeps them.</text>
    <text x="956" y="812">• Zips you download are your</text>
    <text x="966" y="828">off-box disaster copies.</text>
    <text x="956" y="856" fill="#0F3D5E" font-weight="700">Full commands: docs/RECOVERY.md</text>
  </g>
</svg>
